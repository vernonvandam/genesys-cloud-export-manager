<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00a8cc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e6f4f8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7f50"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g transform="translate(100, 50)">
    <!-- Background Flow Waves -->
    <path d="M 50 450 C 200 480, 400 450, 600 300 C 700 220, 750 150, 750 100" fill="none" stroke="url(#primaryFlow)" stroke-width="35" stroke-linecap="round" opacity="0.3"/>
    <path d="M 100 480 C 250 510, 450 470, 630 330 C 720 250, 780 180, 780 120" fill="none" stroke="url(#primaryFlow)" stroke-width="15" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Abstract Network Lines & Nodes -->
    <g stroke="#b0c4de" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6">
      <line x1="550" y1="380" x2="680" y2="450" />
      <line x1="680" y1="450" x2="750" y2="350" />
      <line x1="550" y1="380" x2="480" y2="480" />
      <line x1="480" y1="480" x2="380" y2="500" />
      <line x1="650" y1="200" x2="750" y2="250" />
      <line x1="650" y1="200" x2="580" y2="150" />
    </g>

    <!-- Node Dots -->
    <g fill="#0052cc" opacity="0.7">
      <circle cx="550" cy="380" r="4"/>
      <circle cx="680" cy="450" r="5"/>
      <circle cx="750" cy="350" r="3"/>
      <circle cx="480" cy="480" r="4"/>
      <circle cx="380" cy="500" r="3"/>
      <circle cx="650" cy="200" r="5"/>
      <circle cx="750" cy="250" r="4"/>
      <circle cx="580" cy="150" r="3"/>
    </g>

    <!-- Central Sync / Backup Hub (Circular Motif) -->
    <g transform="translate(500, 280)">
      <!-- Outer Track Ring -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#e1e8ed" stroke-width="8" opacity="0.5"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="url(#blueGlow)" stroke-width="8" stroke-dasharray="250 150" stroke-linecap="round"/>

      <!-- Inner Core Gradient Circle -->
      <circle cx="0" cy="0" r="50" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="50" fill="url(#primaryFlow)" opacity="0.1"/>

      <!-- Sync / Refresh Arrows -->
      <path d="M -22 -10 A 25 25 0 0 1 20 -18 L 12 -28 M 22 10 A 25 25 0 0 1 -20 18 L -12 28" fill="none" stroke="url(#blueGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Arrowheads -->
      <polygon points="18,-35 30,-22 15,-20" fill="#0052cc"/>
      <polygon points="-18,35 -30,22 -15,20" fill="url(#accentOrange)"/>
    </g>

    <!-- Floating UI Card / File Icons -->
    <!-- Database / Storage Icon (Top Right) -->
    <g transform="translate(640, 150)" filter="url(#shadow)">
      <rect x="0" y="0" width="50" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="25" cy="15" rx="20" ry="6" fill="#0052cc" opacity="0.8"/>
      <path d="M 5 20 C 5 28, 45 28, 45 20" fill="none" stroke="#0052cc" stroke-width="2"/>
      <ellipse cx="25" cy="32" rx="20" ry="6" fill="#0052cc" opacity="0.6"/>
      <path d="M 5 37 C 5 45, 45 45, 45 37" fill="none" stroke="#0052cc" stroke-width="2"/>
    </g>

    <!-- Security Shield Icon (Top Left of Hub) -->
    <g transform="translate(390, 200)" filter="url(#shadow)">
      <path d="M 20 0 L 40 10 C 40 30, 25 45, 20 50 C 15 45, 0 30, 0 10 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 20 5 L 35 13 C 35 28, 23 40, 20 44 C 17 40, 5 28, 5 13 Z" fill="#00a8cc" opacity="0.2"/>
      <!-- Checkmark -->
      <polyline points="12,22 18,28 28,16" fill="none" stroke="#0052cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Backup / Archive Document Icon (Bottom Left of Hub) -->
    <g transform="translate(420, 370)" filter="url(#shadow)">
      <rect x="0" y="0" width="45" height="55" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 30 0 L 45 15 L 45 55 L 0 55 L 0 0 Z" fill="#f8fafc"/>
      <path d="M 30 0 L 30 15 L 45 15" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Lines on doc -->
      <line x1="10" y1="22" x2="35" y2="22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="32" x2="35" y2="32" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="42" x2="25" y2="42" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <!-- Orange accent arrow on document -->
      <circle cx="32" cy="42" r="8" fill="url(#accentOrange)"/>
      <polyline points="29,42 32,39 35,42" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Floating Cloud Backup Node -->
    <g transform="translate(620, 310)" filter="url(#shadow)">
      <path d="M 25 10 C 35 10, 42 18, 40 28 C 45 28, 50 33, 50 40 C 50 47, 45 52, 38 52 L 12 52 C 5 52, 0 47, 0 40 C 0 34, 4 30, 10 28 C 8 20, 15 10, 25 10 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 25 13 C 33 13, 39 19, 37 27 C 42 27, 46 31, 46 37 C 46 43, 42 48, 36 48 L 14 48 C 8 48, 4 43, 4 37 C 4 32, 8 28, 13 27 C 11 20, 17 13, 25 13 Z" fill="#e0f2fe" opacity="0.6"/>
      <!-- Upload Arrow inside Cloud -->
      <polyline points="25,38 25,24 M 20,29 L 25,24 L 30,29" fill="none" stroke="#0052cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Watermark Text Style Elements -->
    <text x="470" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#64748b" letter-spacing="4" opacity="0.4">SECURE</text>
    <text x="370" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#64748b" letter-spacing="4" opacity="0.4">DATA</text>
    <text x="630" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#64748b" letter-spacing="4" opacity="0.4">BACKUP</text>
  </g>
</svg>
